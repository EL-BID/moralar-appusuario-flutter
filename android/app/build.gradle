buildscript {
    ext {
        lifecycle_version = '2.6.0'
        kotlin_version = '1.8.0'
        androidx = '1.7.0'
        browser = '1.5.0'
    }
    repositories {
        // ...
        maven { url 'https://plugins.gradle.org/m2/' } // Gradle Plugin Portal
    }
    dependencies {
    }
}
repositories {
    maven { url 'https://maven.google.com' }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 33

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "br.com.megaleios.moralar_appusuario"
        minSdkVersion 22
        targetSdkVersion 30
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        config {
            keyAlias 'megaleios'
            keyPassword 'ckua36'
            storeFile file('mycertNOVA.keystore')
            storePassword 'ckua36'
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            signingConfig signingConfigs.config
        }
        debug {
            signingConfig signingConfigs.config
        }
    }
}

flutter {
    source '../..'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.fragment:fragment:1.6.1'
        force 'androidx.window:window:1.1.0'
        force 'androidx.core:core-ktx:1.6.0'
        force 'androidx.window:window-java:1.1.0'
        force "androidx.lifecycle:lifecycle-livedata-core-ktx:$lifecycle_version"
        force "androidx.lifecycle:lifecycle-service:$lifecycle_version"
        force "androidx.lifecycle:lifecycle-livedata-core:$lifecycle_version"
        force "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
        force "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
        force 'androidx.core:core:1.10.0'
        force "androidx.lifecycle:lifecycle-process:$lifecycle_version"
        force "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
        force "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
        force "androidx.browser:browser:$browser"
        force "androidx.annotation:annotation-experimental:1.3.0"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation platform('com.google.firebase:firebase-bom:28.4.0')
    // implementation 'com.google.firebase:firebase-analytics-ktx'
}
